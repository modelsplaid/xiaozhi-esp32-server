# Docker安装Server

version: '3'
services:
  xiaozhi-esp32-server:
    image: sshesp32adf0525:latest
    container_name: esp32-adf-ssh
    #restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
    ports:
      # ws服务端
      - "8000:8000"
      # ota服务端
      - "8002:8002"
      - "2222:22"
    # devices:
    #   - "//./COM3:/dev/ttyS0"  # 映射 COM3 到容器
    privileged: true  # 开放所有设备权限（有安全隐患）
    volumes:
      # 配置文件目录
      - ./espvolume:/root/espshare
      - ./data:/opt/xiaozhi-esp32-server/data
      # 模型文件挂接，很重要
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
    tty: true
    stdin_open: true
    entrypoint: /bin/bash
    command: -c "echo Hello World && service ssh start &&sleep 3 && tail -f /dev/null"
    #command: docker compose -f docker-compose-esp32adf.yml up -d
    #command: /bin/bash todo: how to start a command in docker compose 